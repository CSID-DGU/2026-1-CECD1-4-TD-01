; =============================================================================
; On-mom 적응형 상담 정책 설정
; =============================================================================
;
; 이 파일은 "센서 원본"이나 "사용자 대화 원문"을 저장하지 않습니다.
; 개인 기준선, 정서 구간, 상담 결과 보상, 야간 학습 속도, 상황별 프롬프트를
; 사람이 직접 수정할 수 있도록 한곳에 모아 둔 운영 설정입니다.
;
; 수정 방법
;   1. 바꾸려는 값 오른쪽의 설명을 먼저 읽습니다.
;   2. 값을 수정한 뒤 아래 명령으로 설정과 Python 문법을 확인합니다.
;        python3 -m unittest discover -s . -p "test_*.py"
;   3. Jetson 서비스를 재시작합니다.
;        systemctl --user restart onmom-derived-insights.service
;   4. 적용 여부를 확인합니다.
;        curl http://localhost:8765/health
;
; 주의
; - 소수는 0.35처럼 마침표로 씁니다.
; - 시간 단위는 키 이름에 적힌 seconds/minutes/hours/days를 따릅니다.
; - 너무 민감하게 낮추면 정상적인 일상 변화도 이상 신호로 잡힐 수 있습니다.
; - [prompt.*]의 여러 줄 값은 다음 줄을 반드시 공백으로 들여써야 합니다.

[meta]
; 설정 구조 버전입니다. 프로그램 호환성 확인용이므로 임의로 바꾸지 마세요.
config_version = 2

[quality]
; 0 이하의 걸음/운동 기록은 "실제로 0"이 아니라 "측정 실패 가능성"으로 보고 제외합니다.
steps_missing_at_or_below = 0
exercise_minutes_missing_at_or_below = 0

; 20m 이하 이동 거리는 동기화 찌꺼기일 가능성이 높아 제외합니다.
distance_km_missing_at_or_below = 0.02

; 걸음 수와 거리가 함께 있을 때 한 걸음당 이동 가능 범위입니다.
meters_per_step_min = 0.20
meters_per_step_max = 2.00

; 하루 총/활동 칼로리의 극소값 제외 기준입니다. 의학적 기준이 아니라 데이터 품질 기준입니다.
total_calories_kcal_min = 50
active_calories_kcal_min = 5

; 심박 센서가 지원하는 물리적 입력 범위입니다. 범위를 벗어나면 해석하지 않습니다.
heart_rate_bpm_min = 35
heart_rate_bpm_max = 220

; rPPG 신호 품질과 최소 측정 시간입니다.
rppg_signal_quality_min = 0.45
rppg_measurement_seconds_min = 10

; 자세 비율을 사용하기 위한 최소 관측 시간입니다.
posture_observation_seconds_min = 60

[trend]
; 최근 구간과 개인 기준선 구간입니다.
recent_window_hours = 24
baseline_window_days = 28

; 기준선 샘플이 이 수보다 적으면 개인 변화 카드를 만들지 않습니다.
min_baseline_samples = 5

; 수정 Z 점수 후보 기준입니다. 1.5는 "통계적 이상치"가 아니라 민감한 변화 후보입니다.
robust_z_candidate_threshold = 1.50

; MAD가 0이거나 척도가 작은 지표를 위한 상대 변화 보조 기준입니다.
relative_change_candidate_threshold = 0.25

; MAD 또는 기준선 중앙값을 0으로 간주하는 수치 오차 한계입니다.
zero_epsilon = 0.000000001

; 최근 샘플이 이 수에 가까워질수록 표본 지지도가 1.0에 가까워집니다.
recent_support_target_samples = 8

; 측정 품질 × 표본 지지도가 이 값보다 낮으면 변화 카드를 만들지 않습니다.
min_card_confidence = 0.35

; 생성된 개인 변화 카드를 유지하는 기간입니다.
card_ttl_hours = 24

[derived_summary]
; Android가 만든 정서 요약은 빨리 낡으므로 짧게, 다른 요약은 길게 유지합니다.
voice_emotion_ttl_minutes = 30
other_summary_ttl_days = 7

; 파생 요약의 시작 신뢰도와, 시간이 지나 폐기할 최소 신뢰도입니다.
initial_confidence = 0.80
min_confidence = 0.20

[rfid]
; 입실 시각 변화 비교 구간입니다.
recent_window_days = 7
baseline_window_days = 28
min_recent_samples = 3
min_baseline_samples = 5

; 개인 기준선보다 이만큼 이상 달라져야 입실 시각 변화로 봅니다.
entry_shift_minutes = 45

; 카드 생성을 위한 최소 품질과 최근 표본 목표 수입니다.
min_card_confidence = 0.40
recent_support_target_samples = 7

; 같은 출처·구역에서 이 시간 안에 반복된 인식은 중복으로 봅니다.
dedupe_seconds = 10

; RFID 생활 리듬 카드를 유지하는 기간입니다.
card_ttl_days = 3

[session_card]
; 상담 전후 정서 변화 요약에 포함할 기간과 최대 세션 수입니다.
lookback_days = 14
max_sessions = 14
min_sessions = 3

; 정서 변화 요약 카드의 최소 신뢰도와 표본 목표 수입니다.
min_confidence = 0.35
support_target_sessions = 8
max_confidence = 0.90
card_ttl_days = 7

[emotion]
; valence는 -1~1, arousal은 0~1입니다.
; valence가 negative_threshold 이하이면 부정 구간입니다.
negative_threshold = -0.25

; 부정 구간에서 arousal이 이 값 이상이면 고각성, 미만이면 저각성입니다.
high_arousal_threshold = 0.55

; valence가 이 값 이상이면 긍정 구간입니다.
positive_threshold = 0.25

; 최근 센서 정서를 현재 정서로 사용할 수 있는 기간과 최소 신뢰도입니다.
current_emotion_window_minutes = 30
current_emotion_min_confidence = 0.35

[reward]
; 부정 상태에서 정서가 긍정 방향으로 이동한 정도와 각성 완화를 합치는 비율입니다.
negative_valence_weight = 0.65
negative_arousal_relief_weight = 0.35

; 중립 상태의 보상 비율입니다.
neutral_valence_weight = 0.50
neutral_arousal_relief_weight = 0.50

; 긍정 상태를 유지한 정도, 추가 정서 변화, 불필요한 각성 증가의 비율입니다.
positive_retention_weight = 0.55
positive_valence_delta_weight = 0.25
positive_arousal_increase_penalty = 0.20

; 긍정 유지 점수의 기준점과 정규화 폭입니다.
positive_retention_floor = 0.10
positive_retention_scale = 0.90

; 명시적 좋아요/싫어요가 연결됐을 때 자동 정서 보상과 사용자 평가를 섞는 비율입니다.
observed_reward_weight = 0.70
explicit_feedback_weight = 0.30

; 계산된 보상을 암묵적 좋아요/싫어요로 표시하는 경계입니다.
; +0.05 이상은 편안 방향(LIKE), -0.05 이하는 격양 방향(DISLIKE), 사이는 중립입니다.
implicit_like_threshold = 0.05
implicit_dislike_threshold = -0.05

; 최종 보상 범위입니다.
reward_min = -1.0
reward_max = 1.0

[learning]
; 상담 결과 한 건이 전략 가중치를 움직이는 기본 속도입니다.
learning_rate = 0.01

; 한 번의 수면 학습에서 전략 하나가 움직일 수 있는 최대 폭입니다.
max_delta_per_run = 0.02

; 전략 가중치의 절대 안전 범위와 새 정책의 시작값입니다.
min_weight = 0.50
max_weight = 1.50
initial_weight = 1.00

; 자동 학습을 다시 실행하기 전 최소 간격입니다.
min_training_interval_hours = 18

; 수면 신호가 이 시간보다 오래되면 자동 학습을 허용하지 않습니다.
sleep_evidence_max_age_minutes = 45

; 수면 confidence × coverage 최소값입니다.
sleep_min_confidence = 0.70

; 한 번의 학습에서 읽을 미학습 상담 결과 상한입니다.
max_outcomes_per_run = 256

; 학습 상태 화면에서 읽을 최근 결과/정책 이력의 수입니다.
status_history_sessions = 60
reward_trend_window_sessions = 10
policy_history_versions = 10

; 상태 화면의 COLLECTING → EARLY_SIGNAL → TREND_AVAILABLE 구간 기준입니다.
early_signal_min_outcomes = 5
trend_available_min_outcomes = 20

; 답변 전 정서와 다음 정서를 같은 상담 결과로 묶을 수 있는 최대 시간입니다.
max_session_outcome_interval_hours = 6

[style.learning]
; 연속형 응답 스타일의 학습률입니다. 전략 학습과 별도로 적용됩니다.
learning_rate = 0.02

; 한 번의 수면 학습에서 스타일 축 하나가 이동할 수 있는 최대 폭입니다.
max_delta_per_run = 0.03

; 모든 스타일 값이 머무를 안전 범위입니다. 0과 1의 극단값은 피합니다.
min_value = 0.05
max_value = 0.95

; 실제로 어떤 스타일이 더 편안했는지 비교하기 위한 작은 탐색 폭입니다.
exploration_initial = 0.12
exploration_min = 0.025
exploration_decay_samples = 40

; 한 답변에서 동시에 시험할 스타일 축 수입니다. 너무 많으면 원인 구분이 어려워집니다.
explored_dimensions_per_response = 2

[style.NEGATIVE_HIGH_AROUSAL]
RESPONSE_LENGTH = 0.25
EMPATHY_RATIO = 0.85
QUESTION_FREQUENCY = 0.20
ADVICE_DIRECTNESS = 0.15
GROUNDING_INTENSITY = 0.80
EXPLANATION_DETAIL = 0.30
PROACTIVITY = 0.35
WARMTH = 0.80
ACTION_SIZE = 0.15
HEALTH_MENTION = 0.10

[style.NEGATIVE_LOW_AROUSAL]
RESPONSE_LENGTH = 0.40
EMPATHY_RATIO = 0.80
QUESTION_FREQUENCY = 0.35
ADVICE_DIRECTNESS = 0.25
GROUNDING_INTENSITY = 0.25
EXPLANATION_DETAIL = 0.45
PROACTIVITY = 0.40
WARMTH = 0.80
ACTION_SIZE = 0.20
HEALTH_MENTION = 0.15

[style.NEUTRAL]
RESPONSE_LENGTH = 0.55
EMPATHY_RATIO = 0.55
QUESTION_FREQUENCY = 0.65
ADVICE_DIRECTNESS = 0.45
GROUNDING_INTENSITY = 0.15
EXPLANATION_DETAIL = 0.55
PROACTIVITY = 0.55
WARMTH = 0.65
ACTION_SIZE = 0.35
HEALTH_MENTION = 0.30

[style.POSITIVE]
RESPONSE_LENGTH = 0.55
EMPATHY_RATIO = 0.55
QUESTION_FREQUENCY = 0.55
ADVICE_DIRECTNESS = 0.45
GROUNDING_INTENSITY = 0.10
EXPLANATION_DETAIL = 0.50
PROACTIVITY = 0.55
WARMTH = 0.75
ACTION_SIZE = 0.40
HEALTH_MENTION = 0.25

[context]
; API가 한 번에 반환할 기본/최대 맥락 카드 수입니다.
default_cards = 3
max_cards = 6

; 가중치 순으로 프롬프트와 앱에 전달할 응답 전략 수입니다.
recommended_strategies = 3

; 현재 주제와 같은 도메인의 카드에 주는 선택 점수 배수입니다.
topic_relevance_multiplier = 1.25

; 정서 카드에 추가하는 작은 우선도입니다.
voice_emotion_relevance_bonus = 0.10

[retention]
; SQLite에서 자동 정리할 보존 기간입니다.
analysis_events_days = 30
context_cards_days = 90
audit_log_days = 180

; 이미 expires_at이 지난 이벤트를 즉시 지우지 않고 남겨둘 짧은 감사용 유예 기간입니다.
expired_event_grace_days = 7

[prompt.common]
; 모든 적응형 프롬프트에 항상 포함되는 안전 규칙입니다.
rules =
    아래 내용은 원본 기록이 아니라 품질 검사를 통과한 파생 정보입니다.
    진단이나 감정 확정에 사용하지 말고, 사용자 경험을 확인하는 질문 방향에만 사용하세요.
    사용자 발화와 충돌하면 사용자 발화를 우선하세요.
    부정적 정서를 무시하거나 회피하도록 강요하지 말고 먼저 공감하고 안정화를 돕습니다.
    긍정적 정서는 과장하지 말고 사용자가 말한 자원과 행동을 구체적으로 강화합니다.
    한 응답에서 확인 질문은 한 가지 주제에 집중합니다.
    센서 종류, RFID 시각, 수치 목록을 사용자에게 먼저 나열하지 않습니다.

[prompt.bucket]
; 정서 구간별로 우선 적용되는 답변 방향입니다.
NEGATIVE_HIGH_AROUSAL =
    사용자가 압도되거나 긴장했을 가능성을 고려해 짧고 차분하게 답합니다.
    해결책을 많이 제시하기 전에 감정을 반영하고, 안전하고 부담이 낮은 안정화 선택지 하나만 제안합니다.
NEGATIVE_LOW_AROUSAL =
    지침·충고를 밀어붙이지 말고 피로감이나 의욕 저하를 먼저 인정합니다.
    질문은 답하기 쉽게 짧게 하고, 행동 제안은 매우 작은 한 단계로 제한합니다.
NEUTRAL =
    현재 상황을 정리하고 사용자가 원하는 도움의 방향을 확인합니다.
    불필요하게 문제를 만들어내지 말고 한 가지 열린 질문으로 대화를 이어갑니다.
POSITIVE =
    긍정 상태를 과장하지 말고 사용자가 실제로 한 행동이나 발견한 자원을 구체적으로 강화합니다.
    흥분을 더 높이기보다 도움이 된 조건을 사용자가 스스로 확인하도록 돕습니다.

[prompt.style]
; {value}는 0~1 값, {percent}는 백분율, {level}은 낮음·중간·높음입니다.
; 문장 수·질문 수·설명 항목·행동 시간은 코드가 연속값에서 계산해 넣습니다.
RESPONSE_LENGTH = 응답 길이 수준 {value:.2f}({level})를 따르고, 전체를 약 {target_sentences}문장으로 맞추세요.
EMPATHY_RATIO = 공감 비중 목표는 약 {percent}%입니다. 먼저 사용자의 표현을 반영한 뒤 남은 부분에 질문이나 제안을 배치하세요.
QUESTION_FREQUENCY = 질문 사용 수준은 {value:.2f}({level})입니다. 이번 답변의 질문은 최대 {max_questions}개이며 한 주제에만 집중하세요.
ADVICE_DIRECTNESS = 조언 직접성은 {value:.2f}({level})입니다. 낮으면 허락을 구하는 선택지로, 높으면 짧고 명확한 제안으로 표현하세요.
GROUNDING_INTENSITY = 안정화 개입 강도는 {value:.2f}({level})입니다. 긴장이 뚜렷할 때만 이 강도에 맞는 짧은 안정화 방법 하나를 선택지로 제시하세요.
EXPLANATION_DETAIL = 설명 상세도는 {value:.2f}({level})입니다. 이유나 정리는 최대 {detail_points}개 핵심으로 제한하세요.
PROACTIVITY = 대화 주도성은 {value:.2f}({level})입니다. 낮으면 경청과 확인을, 높으면 다음 단계 제안을 더 분명히 하세요.
WARMTH = 정서적 따뜻함은 {value:.2f}({level})입니다. 과장하거나 단정하지 않으면서 이 수준에 맞춰 어조를 조절하세요.
ACTION_SIZE = 행동 제안 크기는 {value:.2f}({level})입니다. 제안한다면 약 {action_minutes}분 안에 시작할 수 있는 한 단계로 만드세요.
HEALTH_MENTION = 건강·생활 파생정보 언급 수준은 {value:.2f}({level})입니다. 사용자 발화와 직접 관련될 때만 언급하고 센서 수치를 먼저 나열하지 마세요.

[prompt.strategy]
; 전략 이름이 선택됐을 때 모델에 전달할 구체적인 행동 지침입니다.
EMPATHIC_REFLECTION =
    첫 문장에서 사용자가 직접 말한 감정과 상황을 짧게 반영하세요.
    사용자가 말하지 않은 원인이나 감정을 새로 만들어내지 마세요.
OPEN_QUESTION =
    예/아니오로 몰아가지 않는 짧은 질문 하나를 사용하세요.
    한 응답에서 여러 질문을 연속으로 묻지 마세요.
GROUNDING =
    긴장이나 과부하가 있을 때만 호흡, 발바닥 감각, 주변 사물 보기 같은 짧은 안정화 방법 하나를 선택지로 제안하세요.
    사용자가 원하지 않으면 수행을 강요하지 마세요.
POSITIVE_REINFORCEMENT =
    막연한 칭찬 대신 사용자가 실제로 취한 행동, 버틴 점, 도움을 구한 점을 구체적으로 인정하세요.
    부정적 감정을 긍정으로 덮지 마세요.
MICRO_ACTION =
    지금 또는 오늘 할 수 있는 작고 구체적인 행동 하나만 제안하세요.
    실패해도 부담이 적고 5분 안팎으로 시작할 수 있는 크기를 우선하세요.
QUIET_PRESENCE =
    조언과 분석을 줄이고 짧게 곁에 있는 말로 답하세요.
    침묵이나 휴식을 허용하고 사용자가 더 말하도록 압박하지 마세요.
