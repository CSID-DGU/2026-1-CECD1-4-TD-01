substitutions:
  name: "esp-speaker"
  friendly_name: "ESP TF Speaker"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - delay: 1s
        - dfplayer.set_device: TF_CARD
        - dfplayer.set_volume: 20

esp8266:
  board: esp12e

logger:
  baud_rate: 115200

api:
  actions:
    - action: play_tf_mp3
      variables:
        file: int
      then:
        - dfplayer.set_device: TF_CARD
        - dfplayer.play_mp3: !lambda "return file;"

    - action: set_speaker_volume
      variables:
        volume: int
      then:
        - dfplayer.set_volume: !lambda "return volume;"

ota:
  - platform: esphome

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  ap:
    ssid: "esp-speaker-fallback"
    password: "fallbackpassword"

captive_portal:

uart:
  id: dfplayer_uart
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 9600

dfplayer:
  id: speaker_player
  uart_id: dfplayer_uart
  on_finished_playback:
    - logger.log: "TF MP3 playback finished"

button:
  - platform: template
    name: "Play MP3 1"
    icon: "mdi:play"
    on_press:
      - dfplayer.set_device: TF_CARD
      - dfplayer.play_mp3: 1

  - platform: template
    name: "Stop MP3"
    icon: "mdi:stop"
    on_press:
      - dfplayer.stop

  - platform: template
    name: "Volume Up"
    icon: "mdi:volume-plus"
    on_press:
      - dfplayer.volume_up

  - platform: template
    name: "Volume Down"
    icon: "mdi:volume-minus"
    on_press:
      - dfplayer.volume_down

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
