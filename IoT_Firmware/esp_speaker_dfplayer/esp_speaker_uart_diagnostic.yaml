packages:
  base: !include esp_speaker_final.yaml

logger:
  level: VERY_VERBOSE

uart:
  id: dfplayer_uart
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 100ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

esphome:
  on_boot:
    - priority: -90
      then:
        - delay: 4s
        - logger.log: "UART diagnostic: reset DFPlayer"
        - dfplayer.reset
        - delay: 2s
        - logger.log: "UART diagnostic: select TF and play /mp3/0001.mp3"
        - dfplayer.set_device: TF_CARD
        - delay: 500ms
        - dfplayer.set_volume: 25
        - delay: 500ms
        - dfplayer.play_mp3: 1
